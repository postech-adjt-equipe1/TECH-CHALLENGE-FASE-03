services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hospital_agendamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hospital_agendamento
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8081:8080"

volumes:
  hospital_pgdata:
