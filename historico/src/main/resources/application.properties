spring.application.name=historico

# Datasource - toda credencial/config sensivel e externalizada via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_historico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8083}

management.endpoints.web.exposure.include=health

# GraphQL - endpoint em /graphql; interface interativa GraphiQL em /graphiql
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.schema.printer.enabled=true

# RabbitMQ - consumidor dos eventos consulta.criada / consulta.editada
# publicados pelo Servico de Agendamento. Exchange/routing-key-pattern
# precisam bater com o contrato do README daquele servico.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Retry basico no consumo: 3 tentativas com backoff exponencial; esgotadas
# as tentativas (ou erro permanente de parsing) a mensagem vai para a DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

historico.messaging.exchange=${RABBITMQ_EXCHANGE:agendamento.consultas}
historico.messaging.queue=${RABBITMQ_QUEUE:historico.consultas}
historico.messaging.routing-key-pattern=${RABBITMQ_ROUTING_KEY_PATTERN:consulta.*}
historico.messaging.dead-letter-exchange=${RABBITMQ_DLX:historico.consultas.dlx}
historico.messaging.dead-letter-queue=${RABBITMQ_DLQ:historico.consultas.dlq}
