# Perfil de teste: H2 em memoria, sem Postgres nem RabbitMQ reais.
spring.datasource.url=jdbc:h2:mem:historico;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Nao inicializa a infra de listeners AMQP nos testes (o listener e exercitado
# chamando o metodo diretamente, no mesmo espirito dos demais servicos).
spring.rabbitmq.listener.simple.auto-startup=false

spring.graphql.graphiql.enabled=false

# Placeholders de mensageria (as beans de RabbitMQConfig/listener sao criadas
# no contexto, mesmo sem broker real).
historico.messaging.exchange=agendamento.consultas
historico.messaging.queue=historico.consultas
historico.messaging.routing-key-pattern=consulta.*
historico.messaging.dead-letter-exchange=historico.consultas.dlx
historico.messaging.dead-letter-queue=historico.consultas.dlq
