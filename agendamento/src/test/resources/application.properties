spring.application.name=agendamento-test

spring.datasource.url=jdbc:h2:mem:agendamento;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# RabbitMQConfig exige esta propriedade (sem default); spring.rabbitmq.* fica nos defaults do Boot.
agendamento.messaging.exchange=agendamento.consultas
