services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hospital_notificacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - notificacoes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker proprio, para desenvolver/testar este servico isoladamente.
  # Para rodar o fluxo ponta a ponta com o Servico de Agendamento, aponte
  # RABBITMQ_HOST/RABBITMQ_PORT (abaixo) para o broker daquele servico em
  # vez de subir este, ou os dois vao publicar/consumir em brokers
  # diferentes e nenhum evento vai chegar aqui.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5675:5672"
      - "15675:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/hospital_notificacoes
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JPA_DDL_AUTO: update
      SERVER_PORT: 8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8082"

volumes:
  notificacoes_pgdata:
