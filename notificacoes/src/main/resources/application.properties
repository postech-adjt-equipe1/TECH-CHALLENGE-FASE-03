spring.application.name=notificacoes

# Datasource - toda credencial/config sensivel e externalizada via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_notificacoes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8082}

management.endpoints.web.exposure.include=health

# RabbitMQ - consumidor dos eventos consulta.criada / consulta.editada
# publicados pelo Servico de Agendamento. Exchange/routing-key-pattern
# precisam bater com o contrato documentado no README daquele servico.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
notificacoes.messaging.exchange=${RABBITMQ_EXCHANGE:agendamento.consultas}
notificacoes.messaging.queue=${RABBITMQ_QUEUE:notificacoes.lembretes}
notificacoes.messaging.routing-key-pattern=${RABBITMQ_ROUTING_KEY_PATTERN:consulta.*}
