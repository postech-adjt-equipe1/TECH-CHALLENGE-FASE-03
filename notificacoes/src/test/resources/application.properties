spring.application.name=notificacoes-test

spring.datasource.url=jdbc:h2:mem:notificacoes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# RabbitMQConfig exige estas propriedades (sem default); spring.rabbitmq.* fica nos defaults do Boot.
notificacoes.messaging.exchange=agendamento.consultas
notificacoes.messaging.queue=notificacoes.lembretes
notificacoes.messaging.routing-key-pattern=consulta.*
notificacoes.messaging.dead-letter-exchange=notificacoes.lembretes.dlx
notificacoes.messaging.dead-letter-queue=notificacoes.lembretes.dlq

# O agendador de lembrete de proximidade e exercitado chamando o metodo
# diretamente nos testes; desligado como job para nao competir com os testes.
lembrete.proximidade.enabled=false
